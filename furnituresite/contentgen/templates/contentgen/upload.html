<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Генерація опису — Завантаження</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
        input[type="file"] {
        color: #ddd;
        background-color: #3d444c;
        border: 1px solid #555;
        border-radius: 6px;
        padding: 6px;
    }

    input[type="file"]::file-selector-button {
        background-color: #0d6efd;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        margin-right: 10px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    input[type="file"]::file-selector-button:hover {
        background-color: #0b5ed7;
    }
    body {
        background-color: #1c1f23;
        color: #e3e9ef;
        font-family: "Segoe UI", sans-serif;
        padding: 20px;
    }

    .card {
        background-color: #2a2f36;
        border: 1px solid #444;
        padding: 20px;
        border-radius: 8px;
        max-width: 650px;
        margin: 0 auto;
    }

    h3 {
        color: #fff;
        font-weight: 600;
        margin-bottom: 20px;
    }

    .form-label {
        color: #ddd;
        font-weight: 500;
    }

    .form-control, .form-select {
        background-color: #3d444c;
        color: #fff;
        border-color: #555;
        border-radius: 6px;
    }

    .form-control:focus, .form-select:focus {
        background-color: #3d444c;
        color: #fff;
        border-color: #0d6efd;
        box-shadow: none;
    }

    .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        font-weight: 500;
        color: #fff;
        background-color: #0d6efd;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #0b5ed7;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
    }

    .link-light {
        color: #a3c4ff !important;
        text-decoration: none;
    }

    .link-light:hover {
        text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>Завантаження даних для генерації опису</h3>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Товар</label>
            {{ form.product }}
        </div>
        <div class="mb-3">
            <label class="form-label">Зображення (опціонально)</label>
            {{ form.image }}
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Колір</label>
                {{ form.color }}
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Матеріал</label>
                {{ form.material }}
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Габарити (Ш×В×Г)</label>
                {{ form.dimensions }}
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Стиль</label>
                {{ form.style }}
            </div>
        </div>
        <button class="btn btn-primary">Створити чернетку</button>
    </form>
    <div class="mt-3">
        <a class="link-light" href="/admin/">Перейти в адмінку</a>
    </div>
  </div>
</body>
</html>

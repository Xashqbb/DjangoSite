{% extends "admin/base_site.html" %}

{% block extrahead %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background-color: #121212;
        color: #f1f1f1;
    }

    .order-card {
        background: #1e1e1e;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        padding: 25px;
    }

    h1 {
        font-weight: 600;
        font-size: 1.8rem;
        color: #ffffff;
    }

    label {
        color: #e2e2e2;
    }

    .form-control, .form-select {
        background-color: #2c2c2c;
        color: #f1f1f1;
        border: 1px solid #444;
        height: auto;
        padding: 0.6rem 0.75rem;
    }
    .form-control:focus, .form-select:focus {
        background-color: #2c2c2c;
        border-color: #007bff;
        box-shadow: none;
        color: #fff;
    }

    .btn-back {
        background: #343a40;
        border: none;
        color: white;
        border-radius: 8px;
        padding: 8px 16px;
        transition: all 0.2s;
    }
    .btn-back:hover {
        background: #495057;
    }

    .btn-add {
        border-radius: 8px;
        padding: 6px 14px;
        font-size: 0.9rem;
        border: 1px solid #0d6efd;
        color: #0d6efd;
        background: transparent;
    }
    .btn-add:hover {
        background: #0d6efd;
        color: #fff;
    }

    .btn-submit {
        background: linear-gradient(90deg, #198754, #20c997);
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: 500;
        color: white;
        transition: all 0.3s;
    }
    .btn-submit:hover {
        background: linear-gradient(90deg, #157347, #17a589);
    }

    .item-row {
        background: #2c2c2c;
        border-radius: 8px;
        padding: 10px;
    }

    .removeItem {
        border-radius: 6px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="order-card">
        <h1 class="mb-4">Створення нового замовлення</h1>

        <p>
            <a href="{% url 'crm_orders' %}" class="btn btn-back">
                Назад до замовлень
            </a>
        </p>

        <form id="createOrderForm" class="mb-4">
            {% csrf_token %}
            <div class="mb-3">
                <label for="customer" class="form-label fw-bold">Клієнт</label>
                <select class="form-select" id="customer" name="customer" required>
                    <option value="">-- Оберіть клієнта --</option>
                    {% for c in customers %}
                    <option value="{{ c.id }}" title="{{ c.name }} {{ c.surname }} ({{ c.email }})">
                        {{ c.name }} {{ c.surname }} ({{ c.email }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Товари</label>
                <div id="itemsContainer"></div>
                <button type="button" id="addItemBtn" class="btn btn-add mt-2">
                    Додати товар
                </button>
            </div>

            <button type="submit" class="btn btn-submit">Створити замовлення</button>
        </form>
    </div>
</div>

<script>
// Додавання рядка товару
document.getElementById("addItemBtn").addEventListener("click", function() {
    const container = document.getElementById("itemsContainer");

    const div = document.createElement("div");
    div.className = "row g-2 mb-2 align-items-center item-row";
    div.innerHTML = `
        <div class="col-md-6">
            <select class="form-select product-select" name="product" required>
                <option value="">-- Оберіть товар --</option>
                {% for p in products %}
                <option value="{{ p.id }}" title="{{ p.name }} ({{ p.price }} грн)">
                    {{ p.name }} ({{ p.price }} грн)
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <input type="number" name="quantity" class="form-control" min="1" value="1" required>
        </div>
        <div class="col-md-3 text-end">
            <button type="button" class="btn btn-danger btn-sm removeItem">Видалити</button>
        </div>
    `;
    container.appendChild(div);

    div.querySelector(".removeItem").addEventListener("click", function() {
        div.remove();
    });
});


// Обробка відправки форми
document.getElementById('createOrderForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const itemsContainer = document.getElementById('itemsContainer');
    const customerId = document.getElementById('customer').value;
    const items = [];

    if (!customerId) {
        alert('Будь ласка, оберіть клієнта.');
        return;
    }

    if (itemsContainer.children.length === 0) {
        alert('Будь ласка, додайте хоча б один товар до замовлення.');
        return;
    }

    itemsContainer.querySelectorAll('.item-row').forEach(row => {
        const productId = row.querySelector('.product-select').value;
        const quantity = row.querySelector('input[name="quantity"]').value;

        if (productId && quantity > 0) {
            items.push({
                product: productId,
                quantity: quantity
            });
        }
    });

    if (items.length !== itemsContainer.children.length) {
        alert('Будь ласка, оберіть товар у всіх рядках.');
        return;
    }

    const data = {
        customer: customerId,
        items: items
    };

    fetch("{% url 'crm_create_order_ajax' %}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            alert('Замовлення успішно створено! ID: ' + result.order_id);
            window.location.href = "{% url 'crm_orders' %}";
        } else {
            alert('Сталася помилка: ' + result.error);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Сталася критична помилка.');
    });
});
</script>
{% endblock %}

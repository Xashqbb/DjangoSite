{% extends "admin/base_site.html" %}
{% block content %}
<h1>Журнал дій адміністраторів</h1>

<form method="get" style="margin-bottom: 20px;">
    <label>Користувач:</label>
    <input type="text" name="user" value="{{ request.GET.user }}">
    <label>Тип дії:</label>
    <select name="action">
        <option value="">---</option>
        <option value="create">Створення</option>
        <option value="update">Оновлення</option>
        <option value="delete">Видалення</option>
        <option value="status_change">Зміна статусу</option>
        <option value="login">Вхід</option>
        <option value="logout">Вихід</option>
    </select>
    <button type="submit">Фільтрувати</button>
</form>

<table border="1" cellpadding="5" cellspacing="0">
    <tr>
        <th>Дата</th>
        <th>Адмін</th>
        <th>Тип дії</th>
        <th>Опис</th>
    </tr>
    {% for log in logs %}
    <tr>
        <td>{{ log.timestamp }}</td>
        <td>{{ log.user }}</td>
        <td>{{ log.get_action_type_display }}</td>
        <td>{{ log.description }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">Немає записів</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}

{% extends "admin/crm_base.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    #content { background-color: #1c1f23; }
</style>
{% endblock %}

{% block crm_content %}
<div class="container-fluid py-4 text-light">
    <div class="card bg-dark text-light shadow border border-secondary">
        <div class="card-body">
            <h2 class="mb-4">Логи</h2>
            <div class="table-responsive">
                <table class="table table-dark table-striped table-bordered table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Клієнт</th>
                            <th>Дія</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for log in logs %}
                        <tr>
                            <td>{{ log.date|date:"Y-m-d H:i" }}</td>
                            <td>{{ log.customer }}</td>
                            <td>{{ log.action }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center">Логів поки що немає</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
